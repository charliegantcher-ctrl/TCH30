name: Update TCH30 prices

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC on weekdays = after the US market close
    - cron: "17 1 * * 2-6"    # backup ~4 hours later, in case GitHub skips the first run
  workflow_dispatch:           # adds a "Run workflow" button for manual updates

permissions:
  contents: write              # lets the job commit prices.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch_prices.py
      - name: Commit new prices
        run: |
          git config user.name "tch30-bot"
          git config user.email "tch30-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
